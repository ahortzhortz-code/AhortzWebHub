<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHORTZ WEB HUB</title>
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้า Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        .font-pixel { font-family: 'VT323', monospace; }
        .font-cute { font-family: 'Mali', cursive; }
        
        .retro-shadow {
            box-shadow: 4px 4px 0px 0px #f8bbd0;
        }
        
        .retro-shadow-hard {
            box-shadow: 6px 6px 0px 0px #8c77b8;
        }
        
        .retro-button-shadow {
            box-shadow: 0px 4px 0px 0px #d81b60;
        }
        
        .retro-button-shadow:active {
            box-shadow: 0px 0px 0px 0px #d81b60;
            transform: translateY(4px);
        }

        .text-outline-pink {
            text-shadow: 
                -2px -2px 0 #fff,  
                 2px -2px 0 #fff,
                -2px  2px 0 #fff,
                 2px  2px 0 #fff,
                 0px  4px 0px #ff9ecd;
        }
    </style>
</head>
<body class="min-h-screen bg-[#cbb8e8] flex items-center justify-center p-2 sm:p-4 font-sans selection:bg-pink-300">

    <!-- Main Window Container -->
    <div class="max-w-2xl w-full bg-[#fce4ec] rounded-2xl overflow-hidden border-[5px] border-[#a18cd1] retro-shadow-hard font-cute relative">
        
        <!-- Window OS Header -->
        <div class="bg-[#a18cd1] text-white px-3 py-1.5 flex justify-between items-center border-b-[5px] border-[#a18cd1]">
            <div class="flex items-center gap-2">
                <span class="text-sm">💖</span>
                <span class="text-sm font-bold tracking-widest font-pixel">AHORTZ WEB HUB</span>
            </div>
            <div class="flex gap-1.5">
                <div class="w-3.5 h-3.5 rounded-full bg-blue-300 border-2 border-blue-500"></div>
                <div class="w-3.5 h-3.5 rounded-full bg-yellow-300 border-2 border-yellow-500"></div>
                <div class="w-3.5 h-3.5 rounded-full bg-pink-400 border-2 border-pink-600 flex items-center justify-center">
                    <span class="text-[8px] font-bold text-white leading-none">X</span>
                </div>
            </div>
        </div>

        <!-- Decorative Scenery Header -->
        <div class="bg-gradient-to-b from-[#a0d8ef] to-[#e0f7fa] h-48 relative overflow-hidden border-b-[4px] border-dashed border-[#ffb6c1]">
            <div class="absolute top-2 left-2 text-6xl drop-shadow-md">🌈</div>
            <div class="absolute top-4 left-1/4 text-5xl opacity-90 drop-shadow-sm">☁️</div>
            <div class="absolute top-8 right-1/4 text-4xl opacity-90 drop-shadow-sm">☁️</div>
            <div class="absolute bottom-5 right-4 text-7xl drop-shadow-lg z-10">🏰</div>
            <div class="absolute bottom-5 left-10 text-6xl drop-shadow-md z-20">🐱</div>
            <div class="absolute bottom-4 left-28 text-4xl drop-shadow-md z-10">🌲</div>
            <div class="absolute bottom-2 right-28 text-3xl drop-shadow-md z-10">🌲</div>
            
            <div class="absolute bottom-0 w-full h-10 bg-[#aed581] border-t-[5px] border-[#8bc34a] rounded-t-[40%] scale-110 z-0"></div>
            
            <div class="absolute inset-0 flex flex-col items-center justify-center z-30 pt-2">
                <h1 class="text-4xl sm:text-6xl font-black text-[#ff8cbd] text-outline-pink tracking-wider font-pixel drop-shadow-md text-center">
                    AHORTZ WEB HUB
                </h1>
                <div class="bg-[#ffb6c1] text-white px-4 sm:px-6 py-1.5 rounded-full border-4 border-white text-xs sm:text-sm font-bold mt-2 shadow-md flex items-center justify-center gap-2 max-w-[90%] text-center leading-tight">
                    <span class="text-yellow-200 shrink-0">✨</span>
                    <span>รวมทุกเว็บไซต์ของฉัน จากเคะตัวน้อยน่ารัก</span>
                    <span class="text-yellow-200 shrink-0">✨</span>
                </div>
            </div>
        </div>

        <!-- Dashboard Widgets -->
        <div class="flex flex-col sm:flex-row gap-3 p-4 bg-[#f8e5f0]">
            <!-- Left Widget -->
            <div class="flex-1 bg-white border-4 border-[#dcd1f7] rounded-2xl p-3 flex items-center gap-3 retro-shadow">
                <div class="bg-yellow-100 p-2 rounded-xl border-4 border-yellow-300 text-3xl">
                    🎮
                </div>
                <div>
                    <p class="text-[#6b529e] font-bold text-sm sm:text-base">เลือกเว็บที่ต้องการได้เลย!</p>
                    <p class="text-[#8c77b8] text-xs sm:text-sm">คลิกไอคอนเพื่อเข้าเว็บไซต์ ✨</p>
                </div>
            </div>
            
            <!-- Right Widget -->
            <div class="sm:w-1/3 bg-white border-4 border-[#ffccbc] rounded-2xl p-3 flex flex-col justify-center retro-shadow">
                <div class="flex items-center gap-2 mb-1">
                    <div class="bg-purple-100 p-1 rounded-lg border-2 border-purple-300 text-2xl">
                        🐻
                    </div>
                    <div>
                        <p class="text-[#d81b60] font-bold text-[10px] sm:text-xs uppercase tracking-widest">WELCOME!</p>
                        <p class="text-[#880e4f] font-black font-pixel text-xl leading-none">Lv. 99</p>
                    </div>
                </div>
                <div class="w-full bg-[#f8bbd0] rounded-full h-4 border-2 border-[#ec407a] overflow-hidden p-0.5 mt-1">
                    <div class="bg-[#ff8cbd] h-full w-4/5 rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Main List (จะถูกสร้างด้วย JavaScript ด้านล่าง) -->
        <div id="web-list-container" class="p-3 sm:p-4 flex flex-col gap-3 sm:gap-4 bg-[#fce4ec]">
            <!-- ลิสต์เว็บจะมาแสดงตรงนี้ -->
        </div>

        <!-- Footer Bar -->
        <div class="bg-[#a18cd1] text-white p-2.5 sm:p-3 px-4 flex justify-between items-center border-t-[5px] border-[#8c77b8] font-pixel text-xl">
            <div class="flex items-center gap-2">
                <span class="font-bold text-pink-200">HP</span>
                <div class="flex gap-1 text-pink-400 drop-shadow-sm text-sm sm:text-base">
                    💖 💖 💖
                </div>
                <span class="text-sm sm:text-lg">100/100</span>
            </div>
            
            <div 
                class="hidden sm:flex items-center gap-2 text-purple-100 cursor-pointer hover:text-white transition-colors select-none"
                onclick="toggleAudio()"
                title="Click to play/pause background music"
            >
                <span id="audio-icon" class="text-sm">🔇</span>
                <span id="audio-text" class="tracking-widest text-sm sm:text-base">
                    BGM: CLICK TO PLAY
                </span>
                <audio id="bgm-audio" src="https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3" loop></audio>
            </div>

            <div class="flex items-center gap-2">
                <span class="text-yellow-400 text-sm sm:text-base">🪙</span>
                <span class="text-yellow-300 font-bold tracking-widest">9999</span>
            </div>
        </div>

    </div>

    <!-- Script สำหรับจัดการข้อมูลและการเล่นเพลง -->
    <script>
        // ข้อมูลเว็บไซต์ สามารถแก้ไขเพิ่มเติมตรงนี้ได้เลย
        const webData = [
            {
                id: 1,
                title: "นับจานซูชิโระ",
                url: "https://ahortzhortz-code.github.io/Sushiro-Cal/",
                desc: "สามารถเลือกสีจานได้และหากมีเมนูพิเศษก็สามารถกรอกข้อมูลเพิ่มเข้าไปได้ สามารถบันทึกมื้อและเริ่มมื้อใหม่ได้",
                icon: "🏠"
            },
            {
                id: 2,
                title: "แจ้งเตือนหาร HBO",
                url: "https://ahortzhortz-code.github.io/HBO-Tracker/",
                desc: "สามารถแจ้งระยะเวลาในการจ่ายรายเดือน หรือรายปี หรือกำหนดราคา และมีคิวอาร์โค้ดในการจ่าย",
                icon: "👑"
            },
            {
                id: 3,
                title: "แจ้งเตือนหาร Youtube",
                url: "https://ahortzhortz-code.github.io/Youtube-Tracker-1998/",
                desc: "สามารถแจ้งระยะเวลาในการจ่ายรายเดือน หรือรายปี หรือกำหนดราคา และมีคิวอาร์โค้ดในการจ่าย",
                icon: "📺"
            },
            {
                id: 4,
                title: "MenoTrack",
                url: "https://ahortzhortz-code.github.io/MenoTrack/",
                desc: "ติดตามรอบเดือน และวิเคราะห์สุขภาพของคุณ สามารถกำหนดและคาดการณ์รอบเดือนได้",
                icon: "💌"
            },
            {
                id: 5,
                title: "Split It",
                url: "https://ahortzhortz-code.github.io/split_bill/",
                desc: "หารค่าของ ค่าข้าว เวลาไปเที่ยวกับเพื่อนๆ ระบบจะคำนวณเงินให้รายคน ว่าต้องจ่ายให้ใครบ้างหรือรับเงินจากใครบ้าง โดยมี QR code ให้ชำระทันที",
                icon: "✂️"
            },
            {
                id: 6,
                title: "My Quest Log",
                url: "https://ahortzhortz-code.github.io/Quest-Log---MMORPG-To-Do-List/",
                desc: "to do list ในรูปแบบ MMORPG โดยที่สามารถตั้งเควสระดับสูง กลาง และเควสรายวันเพื่ออัพเลเวลได้",
                icon: "📗"
            },
            {
                id: 7,
                title: "บันทึกค่าน้ำค่าไฟ",
                url: "https://ahortzhortz-code.github.io/Baby-Blue/",
                desc: "เว็บบันทึกค่าน้ำและค่าไฟ กำหนดมิเตอร์เริ่มต้น และรอบบิลได้ สามารถจดบันทึกรายวันได้",
                icon: "📜"
            },
            {
                id: 8,
                title: "Princess Boutique",
                url: "https://ahortzhortz-code.github.io/POS-Point-of-Sale-system-for-book-booths./",
                desc: "ระบบ POS คิดเงินออกบูธ สามารถกำหนดราคา เปลี่ยนชื่อร้าน กำหนดรหัส และสรุปยอดขายให้และนับสต็อกให้ สามารถจ่ายเงินผ่าน QR code ได้",
                icon: "📠"
            },
            {
                id: 9,
                title: "OrderHub",
                url: "https://ahortzhortz-code.github.io/OrderHub/",
                desc: "แอปจดออเดอร์ ไว้สั่งข้าว หรือฝากซื้อของ มีค่าเงินหากเป็นการฝากซื้อของจากต่างประเทศ",
                icon: "🛒"
            }
        ];

        // ฟังก์ชันสำหรับเรนเดอร์รายชื่อเว็บ
        function renderWebList() {
            const container = document.getElementById('web-list-container');
            
            const htmlContent = webData.map(app => `
                <div class="bg-[#fff9fc] border-[4px] border-[#f8bbd0] rounded-2xl p-2 sm:p-3 flex items-center gap-3 hover:border-[#ff9ecd] hover:bg-white transition-colors duration-200 group relative retro-shadow">
                    <!-- Star Number Badge -->
                    <div class="relative shrink-0 flex items-center justify-center w-12 h-12">
                        <span class="text-5xl drop-shadow-md text-yellow-400 absolute">⭐</span>
                        <span class="relative z-10 text-yellow-900 font-black font-pixel text-2xl mt-1">${app.id}</span>
                    </div>

                    <!-- Icon Box -->
                    <div class="shrink-0 bg-white w-14 h-14 rounded-xl border-4 border-[#e1bee7] flex items-center justify-center text-3xl shadow-sm group-hover:scale-110 transition-transform">
                        ${app.icon}
                    </div>

                    <!-- Text Content -->
                    <div class="flex-1 min-w-0 pr-2">
                        <h3 class="text-[#4a148c] font-bold text-sm sm:text-base truncate">${app.title}</h3>
                        <p class="text-[#7b1fa2] text-[10px] sm:text-xs leading-snug line-clamp-2 mt-0.5 opacity-80">
                            ${app.desc}
                        </p>
                    </div>

                    <!-- Action Button -->
                    <a 
                        href="${app.url}" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        class="shrink-0 bg-[#ff9ecd] text-white px-3 sm:px-4 py-2 rounded-xl font-black font-pixel text-xl sm:text-2xl border-4 border-white retro-button-shadow flex items-center gap-1 transition-transform"
                    >
                        GO! <span class="text-xs sm:text-sm">▶</span>
                    </a>
                </div>
            `).join('');

            container.innerHTML = htmlContent;
        }

        // ระบบควบคุมเพลง (Audio Toggle)
        let isPlaying = false;
        const audioElement = document.getElementById('bgm-audio');
        const audioIcon = document.getElementById('audio-icon');
        const audioText = document.getElementById('audio-text');

        function toggleAudio() {
            if (isPlaying) {
                audioElement.pause();
                audioIcon.textContent = '🔇';
                audioIcon.classList.remove('animate-bounce');
                audioText.textContent = 'BGM: CLICK TO PLAY';
            } else {
                audioElement.play();
                audioIcon.textContent = '🎵';
                audioIcon.classList.add('animate-bounce');
                audioText.textContent = 'BGM: LOFI PIXEL (ON)';
            }
            isPlaying = !isPlaying;
        }

        // เริ่มต้นการทำงานเมื่อหน้าเว็บโหลดเสร็จ
        window.onload = () => {
            renderWebList();
        };
    </script>
</body>
</html>
